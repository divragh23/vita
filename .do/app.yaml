# DigitalOcean App Platform spec for VitaAI.
# Import this in the DO console (Create App → "Import from app spec"), or via:
#   doctl apps create --spec .do/app.yaml
#
# Before importing, replace YOUR_GITHUB_USERNAME/vita with your actual repo,
# then set the SECRET env values in the DO dashboard (they are not stored here).
name: vita
region: nyc

services:
  - name: api
    github:
      repo: YOUR_GITHUB_USERNAME/vita
      branch: main
      deploy_on_push: true
    source_dir: server
    environment_slug: node-js
    run_command: node index.js
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
        preserve_path_prefix: true   # keep the /api prefix when forwarding
    envs:
      - key: GROQ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_USER
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
      - key: FEEDBACK_TO
        scope: RUN_TIME
        value: divragh65@gmail.com
      - key: PORTFOLIO_ORIGIN
        scope: RUN_TIME
        value: https://vita.div23.app

static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/vita
      branch: main
    source_dir: client
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /

domains:
  - domain: vita.div23.app
    type: PRIMARY
